</style></head><body><main class="app"><header class="top"><div><div class="brand">🌙 Si Cilik Muslim</div><div class="small" id="subtitle">Jom belajar sambil main</div></div><button class="lang" id="langBtn" aria-label="Change language">🇲🇾 BM ⇄ EN</button></header><section id="home"><div class="hero"><h1 id="heading">Assalamualaikum! ✨</h1><p id="intro">Jom main dengan Adam dan Aisyah!</p></div><div class="scene"><span class="sun">☀️</span><span class="mosque">🕌</span><button class="kid" id="adam" aria-label="Adam">👦🏻</button><button class="kid" id="aisyah" aria-label="Aisyah">👧🏻</button></div><div style="text-align:center"><div class="bubble" id="bubble" aria-live="polite">👆 Tekan Adam atau Aisyah!</div></div><div class="voicebar"><select id="voiceSelect" aria-label="Pilih suara"></select><button id="testVoice" type="button">🔊 Uji suara</button></div><div class="voicenote" id="voiceNote"></div><div class="grid" id="categories"></div></section><section id="activity" class="hidden"><button class="back" id="back">← Kembali</button><h2 class="activity-title" id="activityTitle"></h2><p class="hint" id="hint"></p><div class="stagebar" id="stagebar"></div><div class="items" id="items"></div><div class="stageactions"><button class="next hidden" id="nextStage"></button><button class="restart hidden" id="restartStage"></button></div><div class="feedback" id="feedback" aria-live="polite"></div></section><div class="footer" id="footer">Main dengan ibu atau ayah • Tiada iklan • Suara bergantung pada telefon</div></main><script>

Terima kasih","Thank you"],["🤗","Sama-sama","You are welcome"],["👋","Selamat tinggal","Goodbye"],["💛","Maaf","Sorry"]],[["🍽️","Bismillah sebelum makan","Bismillah before eating"],["🥰","Alhamdulillah selepas makan","Alhamdulillah after eating"],["👋","Salam bila berjumpa","Salam when meeting"],["💖","Masya-Allah bila kagum","Masha Allah when amazed"]]],[[["خ","Kha","Kha"],["د","Dal","Dal"],["ذ","Dzal","Dhal"],["ر","Ra","Ra"],["ز","Zai","Zay"],["س","Sin","Seen"]],[["ش","Syin","Sheen"],["ص","Sad","Sad"],["ض","Dad","Dad"],["ط","To","Ta"],["ظ","Zo","Za"],["ع","Ain","Ayn"]]],[[["🌈","Pelangi","Rainbow"],["🌧️","Hujan","Rain"],["🏔️","Gunung","Mountain"],["🌊","Laut","Sea"],["🍎","Epal","Apple"],["🍌","Pisang","Banana"]],[["🐈","Kucing","Cat"],["🐝","Lebah","Bee"],["🐠","Ikan","Fish"],["🦋","Rama-rama","Butterfly"],["🌻","Bunga matahari","Sunflower"],["🌴","Pokok kelapa","Coconut tree"]]]];data.forEach((d,i)=>d.levels=[d.items,...extraLevels[i]]);let stage=0,seen=new Set();let lang='ms',current=-1;const $=id=>document.getElementById(id);let chosenVoice="";function voiceList(){return ('speechSynthesis' in window)?speechSynthesis.getVoices():[]}function localVoices(){const prefix=lang==='ms'?'ms':'en';return voiceList().filter(v=>v.lang.toLowerCase().startsWith(prefix))}function updateVoices(){let sel=$('voiceSelect'),vs=localVoices();sel.replaceChildren();if(!('speechSynthesis' in window)){sel.add(new Option(lang==='ms'?'Suara tidak disokong':'Speech unavailable',''));sel.disabled=true;$('voiceNote').textContent=lang==='ms'?'Pelayar ini tidak menyokong suara automatik.':'This browser does not support speech.';return}sel.disabled=false;if(!vs.length){sel.add(new Option(lang==='ms'?'Tiada suara Melayu pada telefon':'No English voice found',''));sel.disabled=true;$('voiceNote').textContent=lang==='ms'?'Tiada suara Bahasa Melayu dikesan. Pasang suara Bahasa Melayu (Malaysia) dalam tetapan teks-ke-pertuturan telefon untuk sebutan yang lebih baik.':'Install an English text-to-speech voice in device settings.';return}vs.sort((a,b)=>Number(b.lang.toLowerCase()==='ms-my')-Number(a.lang.toLowerCase()==='ms-my'));vs.forEach(v=>sel.add(new Option(v.name+' ('+v.lang+')',v.voiceURI)));let match=vs.find(v=>v.voiceURI===chosenVoice);sel.value=(match||vs[0]).voiceURI;chosenVoice=sel.value;$('voiceNote').textContent=lang==='ms'?(vs.some(v=>v.lang.toLowerCase()==='ms-my')?'Suara Bahasa Melayu Malaysia tersedia. Pilih dan uji suara yang paling sesuai.':'Suara Melayu tersedia tetapi bukan khusus ms-MY; sebutan mungkin berbeza.'):'Choose a voice and tap to test.'}let introAudio=null;function playIntro(name){if(lang!=='ms')return false;if('speechSynthesis' in window)speechSynthesis.cancel();if(introAudio){introAudio.pause();introAudio.currentTime=0;}introAudio=new Audio('audio/'+name.toLowerCase()+'.mp3');introAudio.play().catch(()=>{$('bubble').textContent='Tekan sekali lagi untuk dengar suara.'});return true}function speak(s){if(introAudio){introAudio.pause();introAudio.currentTime=0;} if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang=lang==='ms'?'ms-MY':'en-US';u.rate=lang==='ms'?.82:.85;u.pitch=1.04;let vs=localVoices();let voice=vs.find(v=>v.voiceURI===chosenVoice)||vs.find(v=>v.lang.toLowerCase()==='ms-my')||vs[0];if(voice){u.voice=voice;u.lang=voice.lang}else if(lang==='ms'){return}speechSynthesis.speak(u)}function label(obj){return obj[lang]}function render(){document.documentElement.lang=lang;$('subtitle').textContent=lang==='ms'?'Jom belajar sambil main':'Learn through play';$('heading').textContent=lang==='ms'?'Assalamualaikum! ✨':'Assalamu Alaikum! ✨';$('intro').textContent=lang==='ms'?'Jom main dengan Adam dan Aisyah!':"Let's play with Adam & Aisyah!";$('bubble').textContent=lang==='ms'?'👆 Tekan Adam atau Aisyah!':'👆 Tap Adam or Aisyah!';$('footer').textContent=lang==='ms'?'Main dengan ibu atau ayah • Tiada iklan • Suara Adam dan Aisyah dirakam; perkataan lain menggunakan suara telefon':'Play with a parent • No ads • Voice depends on device';$('back').textContent=lang==='ms'?'← Kembali':'← Back';$('categories').replaceChildren();data.forEach((d,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<span>'+d.icon+'</span>'+label(d);b.onclick=()=>openActivity(i);$('categories').append(b)});chosenVoice='';updateVoices();$('testVoice').textContent=lang==='ms'?'🔊 Uji suara':'🔊 Test voice';if(current>=0)openActivity(current,stage)}function openActivity(i,requestedStage){
 if(i!==current){stage=0;seen=new Set()}else if(Number.isInteger(requestedStage)){stage=requestedStage;seen=new Set()}
 current=i;$('home').classList.add('hidden');$('activity').classList.remove('hidden');
 const d=data[i],entries=d.levels[stage];$('activityTitle').textContent=d.icon+' '+label(d);
 $('hint').textContent=lang==='ms'?'Tekan semua gambar satu demi satu.':'Tap every picture, one by one.';
 $('feedback').textContent='';$('items').replaceChildren();$('nextStage').classList.add('hidden');$('restartStage').classList.add('hidden');
 $('restartStage').textContent=lang==='ms'?'↻ Main Semula':'↻ Play Again';
 const update=()=>{
  $('stagebar').textContent=(lang==='ms'?'Peringkat ':'Level ')+(stage+1)+' / '+d.levels.length+'  •  '+seen.size+' / '+entries.length;

   $('nextStage').textContent=stage<d.levels.length-1?(lang==='ms'?'Peringkat Seterusnya ➜':'Next Level ➜'):(lang==='ms'?'Main Dari Awal ↻':'Play From Start ↻');
   $('nextStage').classList.remove('hidden');$('restartStage').classList.remove('hidden');

 };
